name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build documentation
        run: npm run build
        env:
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: npm run typecheck
      - name: Check exported routes and assets
        run: npm run check:docs
        env:
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload documentation
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: examples/next/out
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published documentation
        env:
          DOCS_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors "${DOCS_URL%/}/" -o /dev/null
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors "${DOCS_URL%/}/docs/installation/" -o /dev/null
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors "${DOCS_URL%/}/docs/button/" -o /dev/null
